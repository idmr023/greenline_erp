# ============================================================
# Fuentes de datos del dashboard (Google Sheets)
# ============================================================
# AQUÍ SE COLOCAN LOS ENLACES. Cambiar la `url` cambia la fuente
# de datos del dashboard — no hace falta tocar código.
#
# Cada fuente necesita:
#   id:      nombre corto SIN espacios ni acentos (se usa en la URL
#            del dashboard, p. ej. /dashboard/inventario)
#   nombre:  etiqueta que se ve en el selector de la página
#   url:     enlace completo del Google Sheet (compartido como
#            "Cualquier persona con el enlace puede ver")
#   hojas:   QUÉ pestañas leer. Tres formas:
#              hojas: "*"              → TODAS las pestañas (auto-descubre
#                                        vía GOOGLE_SHEETS_API_KEY; cada fila
#                                        lleva una columna extra `_pestaña`)
#              hojas: ["PestañaA", "B"] → SOLO esas pestañas (lista explícita)
#              hoja: "Pestaña"          → UNA sola pestaña (sin columna extra)
#            Si no se define ninguna, se lee la primera pestaña.
#   activa:  true/false — false oculta la fuente sin borrarla
#
# IMPORTANTE: la hoja debe estar compartida públicamente
# (Archivo → Compartir → "Cualquier persona con el enlace puede ver").
# Para `hojas: "*"`, además se necesita GOOGLE_SHEETS_API_KEY en .env / env vars.
# ============================================================

fuentes:
  - id: evaluacion-armadores
    nombre: "Evaluación Armadores (Cierre de Mes)"
